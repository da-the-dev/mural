name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: v
        run: |
          v="${RAW_VERSION#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- Optional signing: enabled automatically when secrets exist ----
      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERTIFICATE secret set - building an UNSIGNED, un-notarized DMG."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Build
        run: |
          xcodebuild \
            -project Mural.xcodeproj \
            -scheme Mural \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign (Developer ID, hardened runtime)
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="build/dd/Build/Products/Release/Mural.app"
          codesign --force --options runtime --timestamp --sign "$SIGN_ID" \
            "$APP/Contents/Frameworks/WallpaperKit.framework"
          codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build DMG
        run: |
          ./scripts/make_dmg.sh \
            build/dd/Build/Products/Release/Mural.app \
            "build/Mural-${{ steps.v.outputs.version }}.dmg"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="build/Mural-${{ steps.v.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Mural ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: build/Mural-*.dmg
